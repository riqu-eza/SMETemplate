server {
    listen 80;
    server_name _;  # We don't need to match specific domains here since the external proxy handles that.

    # Serve the built static files from your client app
    root /usr/share/nginx/html;
    index index.html;

    # If you're using a single-page application (SPA), ensure that unknown URLs fall back to index.html.
    # This line tells Nginx to serve index.html when a file or folder is not found,
    # so client-side routing works properly.
    try_files $uri $uri/ /index.html;

    # (Optional) If you want to *also* proxy /api requests inside this container:
    # But typically, the external Nginx is already proxying /api to your API container.
    #
    # location /api/ {
    #     proxy_pass http://sme_api:3011;  # Docker network name if you want internal proxy
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
